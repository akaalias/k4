="1.4" font-weight="600">24 ZONES OVER 26 LETTERS</text><text x="54" y="67.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">Zone z sits at letter offset 26z/24,</text><text x="54" y="87.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">rounded down: 0, 1, 2, ... 11, 13, 14,</text><text x="54" y="107.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">... 24. The offset grows by one at every</text><text x="54" y="127.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">step but two: from zone 11 to 12, and as</text><text x="54" y="147.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">the ring wraps round from 24 to 0.</text><text x="514" y="67.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">A shift that grows by exactly one per</text><text x="514" y="87.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">letter is a progressive key, closed by</text><text x="514" y="107.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">0155. The ring's uneven steps are new;</text><text x="514" y="127.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">with any secret word they still fail.</text></svg>