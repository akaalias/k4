ia, serif" font-size="9.5" fill="#6b6a60" text-anchor="start" font-weight="600" style="">number</text><text x="134" y="67.42" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="9.5" fill="#6b6a60" text-anchor="start" font-weight="600" style="">reduce</text><text x="254" y="67.42" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="9.5" fill="#6b6a60" text-anchor="start" font-weight="600" style="">entry</text><path d="M50,74 L330,74" stroke="#111111" stroke-width="0.9"/><text x="54" y="87.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">38</text><text x="134" y="87.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">38 mod 26</text><text x="254" y="87.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">12</text><text x="54" y="107.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">57</text><text x="134" y="107.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">57 mod 26</text><text x="254" y="107.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">5</text><text x="54" y="127.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">6</text><text x="134" y="127.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">6 mod 26</text><text x="254" y="127.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">6</text><text x="54" y="147.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">5</text><text x="134" y="147.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">5 mod 26</text><text x="254" y="147.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">5</text><path d="M50,154 L330,154" stroke="#6b6a60" stroke-width="0.6"/><text x="394" y="67.42" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="9.5" fill="#6b6a60" text-anchor="start" font-weight="600" style="">table, filled by rows</text><rect x="411.5" y="75.5" width="17" height="17" rx="2" fill="#8a6d1f"/><text x="420.0" y="86.88" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#fffff8" text-anchor="middle" font-weight="700">12</text><rect x="451.5" y="75.5" width="17" height="17" rx="2" fill="#8a6d1f"/><text x="460.0" y="86.88" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#fffff8" text-anchor="middle" font-weight="700">5</text><rect x="411.5" y="95.5" width="17" height="17" rx="2" fill="#8a6d1f"/><text x="420.0" y="106.88" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#fffff8" text-anchor="middle" font-weight="700">6</text><rect x="451.5" y="95.5" width="17" height="17" rx="2" fill="#8a6d1f"/><text x="460.0" y="106.88" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#fffff8" text-anchor="middle" font-weight="700">5</text><text x="554" y="67.96" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">Determinant: 12 x 5 - 5 x 6 = 30, which</text><text x="554" y="87.96" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">is 4 mod 26.</text><text x="554" y="107.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#6b6a60" text-anchor="start" font-weight="400" style="">4 shares a factor with 26, so the table</text><text x="554" y="127.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#6b6a60" text-anchor="start" font-weight="400" style="">has no inverse mod 26: it can encipher</text><text x="554" y="147.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#6b6a60" text-anchor="start" font-weight="400" style="">pairs but not decipher them.</text><text x="54" y="187.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">Using it to encipher, look for the pair it sends to each</text><text x="54" y="207.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">carved pair, and count how many of the 24 known letters come</text><text x="54" y="227.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">out right.</text></svg>