="1.4" font-weight="600">ONE PLACEMENT: THE AT PLACE 1, KEY LENGTH 8, TWO UNKNOWN ALPHABETS</text><text x="54" y="67.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">THE at places 1-3 adds three letters to</text><text x="54" y="87.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">the 24 known ones. With a key of length</text><text x="54" y="107.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">8 they fall in key slots the known</text><text x="54" y="127.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">letters already use, so they add</text><text x="54" y="147.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">equations on the same unknown alphabets.</text><text x="54" y="167.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">An exact search then says whether any</text><text x="54" y="187.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">pair of alphabets fits all 27 letters at</text><text x="54" y="207.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">once.</text><text x="514" y="67.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">Most placements still fit: short words</text><text x="514" y="87.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">add few checks. What matters is the</text><text x="514" y="107.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">share. K4's share sits among its ten</text><text x="514" y="127.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">copies' shares, above them all in one</text><text x="514" y="147.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">setting of ten, as each copy manages 0</text><text x="514" y="167.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">to 3 times.</text></svg>