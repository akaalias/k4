e', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">1. Take 97 letters of Carter's book and encipher</text><text x="54" y="87.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">them with one recipe, say a 7-letter secret word</text><text x="54" y="107.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">on the sculpture's table.</text><text x="54" y="127.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">2. Find the doubled letters and write the result</text><text x="54" y="147.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">in rows of 7: count the doubled letters in the</text><text x="54" y="167.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">fullest column.</text><text x="54" y="187.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">3. Write it in rows of 21 and count the letter</text><text x="54" y="207.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="400" style="">pairs, one above the other, that occur twice.</text><text x="534" y="67.42" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="9.5" fill="#6b6a60" text-anchor="start" font-weight="600" style="">the copper</text><text x="834" y="67.42" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="9.5" fill="#6b6a60" text-anchor="start" font-weight="600" style="">count</text><path d="M530,74 L910,74" stroke="#111111" stroke-width="0.9"/><text x="534" y="87.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">doubled letters</text><text x="834" y="87.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">6</text><text x="534" y="107.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">fullest column at width 7</text><text x="834" y="107.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">5</text><text x="534" y="127.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">pairs 21 apart occurring twice</text><text x="834" y="127.96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="400" style="">11</text><path d="M530,134 L910,134" stroke="#6b6a60" stroke-width="0.6"/><text x="534" y="167.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#8c2f1f" text-anchor="start" font-weight="600" style="">A recipe matches the copper only if one</text><text x="534" y="187.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#8c2f1f" text-anchor="start" font-weight="600" style="">stretch reaches 5 in the column and 11</text><text x="534" y="207.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#8c2f1f" text-anchor="start" font-weight="600" style="">repeats at once. None did in 4,000 tries</text><text x="534" y="227.78" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="10.5" fill="#8c2f1f" text-anchor="start" font-weight="600" style="">of any recipe.</text></svg>